<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaLog - Rastrear entrega</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background:#0a0e2e; min-height:100vh; padding:18px; color:#e8ecf8; font-family:'Share Tech Mono',monospace; }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
      pointer-events: none;
      z-index: 100;
    }
    .track-page { max-width:1120px; margin:0 auto; position:relative; }
    .track-hero {
      display:flex; justify-content:space-between; gap:18px; align-items:center;
      margin-bottom:18px; padding:clamp(18px,3vw,28px);
      border:2px solid rgba(0,229,255,0.15); background:#111a3e;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    }
    .track-hero img { width:118px; padding:10px; background:rgba(0,229,255,0.06); border: 1px solid rgba(0,229,255,0.15); }
    .track-hero h1 {
      margin:0; font-family:'Oswald',sans-serif; color:#fff;
      font-size:clamp(28px,5vw,48px); line-height:1;
      text-transform:uppercase; letter-spacing:3px;
    }
    .track-hero p { margin:6px 0 0; color:#8892b0; font-size:13px; font-family:'Share Tech Mono',monospace; }
    .track-search {
      display:grid; grid-template-columns:1fr 1fr auto; gap:12px;
      background:#111a3e; padding:16px;
      border:2px solid rgba(0,229,255,0.15); margin-bottom:18px;
    }
    .track-search input {
      min-height:44px; border-color:rgba(0,229,255,0.15); border-radius:0;
      background:#0d1435; color:#e8ecf8;
      font-family:'Share Tech Mono',monospace; font-size:13px;
    }
    .track-search input:focus { border-color:#00e5ff; box-shadow:0 0 0 2px rgba(0,229,255,0.1); }
    .track-search button {
      min-height:44px; border:0; background:#00e5ff; color:#0a0e2e;
      font-family:'Share Tech Mono',monospace; font-weight:700;
      text-transform:uppercase; letter-spacing:2px; cursor:pointer;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    }
    .track-search button:hover { background:#ffd600; }
    .track-shell { display:grid; grid-template-columns:minmax(0,1fr) minmax(300px,340px); gap:18px; }
    #clienteTrackingMap {
      height:64vh; min-height:420px;
      background:repeating-linear-gradient(45deg,rgba(0,229,255,0.02) 0 1px,transparent 1px 18px);
      border:2px solid rgba(0,229,255,0.15); overflow:hidden;
    }
    .track-side {
      background:#111a3e; padding:20px;
      border:2px solid rgba(0,229,255,0.15);
    }
    .track-side h2 {
      margin-top:0; font-family:'Oswald',sans-serif; font-size:1.1rem;
      color:#00e5ff; text-transform:uppercase; letter-spacing:2px;
    }
    .track-row { padding:12px 0; border-bottom:1px solid rgba(0,229,255,0.1); }
    .track-row span { display:block; color:#8892b0; font-family:'Oswald',sans-serif; font-size:.7rem; text-transform:uppercase; font-weight:700; letter-spacing:1.5px; }
    .track-row strong { display:block; margin-top:4px; color:#e8ecf8; font-family:'VT323',monospace; font-size:1.1rem; letter-spacing:1px; }
    .track-error { color:#f87171; margin-top:10px; font-weight:700; }
    .tracking-map-empty { display:flex; align-items:center; justify-content:center; height:100%; color:#8892b0; font-size:.9rem; text-align:center; padding:24px; }
    .tracking-marker-wrap { background:none; border:none; }
    .tracking-marker { width:26px; height:26px; border-radius:50%; border:3px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.4); position:relative; }
    .tracking-marker::after { content:''; position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; }
    .tracking-marker-origem { background:#10b981; }
    .tracking-marker-origem::after { border-top:6px solid #10b981; }
    .tracking-marker-destino { background:#ef4444; }
    .tracking-marker-destino::after { border-top:6px solid #ef4444; }
    .tracking-marker-entregador { background:#ffd600; animation:pulse 2s infinite; }
    .tracking-marker-entregador::after { border-top:6px solid #ffd600; }
    @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(0,229,255,.5); } 50%{ box-shadow:0 0 0 10px rgba(0,229,255,0); } }
    .leaflet-control-attribution { font-size:10px !important; }
    @media (max-width:800px) { .track-search, .track-shell, .track-hero { grid-template-columns:1fr; display:grid; } #clienteTrackingMap { height:52vh; } }
  </style>
</head>
<body>
  <main class="track-page">
    <section class="track-hero">
      <div>
        <h1>Rastrear entrega</h1>
        <p>Acompanhe a posição do entregador em tempo real.</p>
      </div>
      <p style="font-size:1.4rem;font-weight:700"><i class="ph ph-drop"></i> AquaLog</p>
    </section>

    <form id="clienteTrackingForm" class="track-search">
      <input id="clienteTrackingId" type="number" min="1" placeholder="Número da entrega" required>
      <input id="clienteTrackingTelefone" placeholder="Telefone usado no pedido" required>
      <button>Rastrear</button>
    </form>
    <div id="clienteTrackingErro" class="track-error"></div>

    <section class="track-shell">
      <div id="clienteTrackingMap">
        <div class="tracking-map-empty">Informe os dados da entrega para abrir o rastreamento.</div>
      </div>
      <aside class="track-side">
        <h2 id="clienteTrackingTitulo">Entrega</h2>
        <div class="track-row"><span>Status</span><strong id="clienteTrackingStatus">--</strong></div>
        <div class="track-row"><span>Entregador</span><strong id="clienteTrackingDriver">--</strong></div>
        <div class="track-row"><span>Veículo</span><strong id="clienteTrackingVeiculo">--</strong></div>
        <div class="track-row"><span>ETA</span><strong id="clienteTrackingEta">--</strong></div>
        <div class="track-row"><span>Distância restante</span><strong id="clienteTrackingDistancia">--</strong></div>
        <div class="track-row"><span>Destino</span><strong id="clienteTrackingDestino">--</strong></div>
      </aside>
    </section>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/tracking-cliente.js"></script>
</body>
</html>
